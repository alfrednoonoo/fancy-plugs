name: build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'reference/**'
      - 'design/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to build
        type: choice
        default: all
        options: [all, kicker, exciter, comp, eq, verb, delay, multicomp, fir, gate, limit]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: ${{ github.event.inputs.plugin || 'all' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Record build identifiers
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      # Includes JUCE's prebuilt juceaide, so the key changes with the runner image.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 2G

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DFANCY_PLUGINS="$PLUGIN"
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        id: build
        run: cmake --build build -- -k 0

      - name: Run DSP tests
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Record measurements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path measurements | Out-Null
          $exe = Get-ChildItem -Path build/tests -Recurse -File -Filter 'fancy-tests.exe' | Select-Object -First 1
          & $exe.FullName '[measure]' | Tee-Object -FilePath measurements/measurements.txt
          if ($LASTEXITCODE -ne 0) { throw "measurements exited with $LASTEXITCODE" }

      - name: Stage VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem -Path build/plugins -Recurse -Directory -Filter '*.vst3')
          if ($bundles.Count -eq 0) { throw 'No .vst3 bundles were built' }
          foreach ($bundle in $bundles) { Copy-Item -Path $bundle.FullName -Destination dist -Recurse }
          Copy-Item -Path scripts/install.ps1 -Destination dist
          Get-ChildItem -Path dist -Recurse -File | ForEach-Object { $_.FullName }

      # Steinberg's own conformance check (Phase 2.1 H.7.1), built once per SDK tag.
      - name: Cache Steinberg VST3 validator
        id: validator-cache
        uses: actions/cache@v6
        with:
          path: validator-bin
          key: vst3-validator-v3.8.0_build_66-${{ runner.os }}-${{ env.IMAGE_VERSION }}

      - name: Build Steinberg VST3 validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          git clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S vst3sdk -B vst3sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk-build --target validator
          mkdir -p validator-bin
          find vst3sdk-build -name 'validator.exe' -exec cp {} validator-bin/ \;
          ls -la validator-bin

      - name: Run Steinberg VST3 validator
        shell: bash
        timeout-minutes: 10
        run: |
          status=0
          for bundle in dist/*.vst3; do
            echo "::group::validator $bundle"
            if ! ./validator-bin/validator.exe "$bundle"; then
              echo "::error::Steinberg validator failed for $bundle"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run pluginval
        shell: bash
        timeout-minutes: 15
        run: |
          curl -fsSLO https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y pluginval_Windows.zip -opluginval
          for bundle in dist/*.vst3; do
            echo "::group::pluginval $bundle"
            ./pluginval/pluginval.exe --strictness-level 10 --vst3validator "$(pwd)/validator-bin/validator.exe" --validate "$bundle"
            echo "::endgroup::"
          done

      # The built bundles loaded as a host loads them (Phase 2.1 H.7.2).
      - name: Run host-behaviour harness
        shell: pwsh
        timeout-minutes: 20
        run: |
          $exe = Get-ChildItem -Path build/tools/hosttest -Recurse -File -Filter 'fancy-hosttest.exe' | Select-Object -First 1
          if (-not $exe) { throw 'fancy-hosttest.exe was not built' }
          & $exe.FullName dist | Tee-Object -FilePath measurements/hosttest.txt
          if ($LASTEXITCODE -ne 0) { throw "fancy-hosttest exited with $LASTEXITCODE" }

      # FancyBench (Phase 3 Q1): checks against known answers on our own plugins, and runs the
      # example test files with the competitors skipped. Needs every plugin built.
      - name: Run FancyBench smoke checks
        if: env.PLUGIN == 'all'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $exe = Get-ChildItem -Path build/tools/bench -Recurse -File -Filter 'FancyBench.exe' | Select-Object -First 1
          if (-not $exe) { throw 'FancyBench.exe was not built' }
          & $exe.FullName smoke dist measurements/measurements.txt measurements/bench tools/bench/examples | Tee-Object -FilePath measurements/bench.txt
          if ($LASTEXITCODE -ne 0) { throw "FancyBench smoke exited with $LASTEXITCODE" }

      # A test host for the user's PC (Phase 2.1 H.7.3), built once per JUCE version.
      - name: Cache AudioPluginHost
        id: pluginhost-cache
        uses: actions/cache@v6
        with:
          path: pluginhost-bin
          key: audiopluginhost-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Build AudioPluginHost
        if: steps.pluginhost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 20
        run: |
          cmake --build build --target AudioPluginHost
          New-Item -ItemType Directory -Force -Path pluginhost-bin | Out-Null
          $exe = Get-ChildItem -Path build/AudioPluginHost -Recurse -File -Filter 'AudioPluginHost.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AudioPluginHost.exe was not built' }
          Copy-Item $exe.FullName pluginhost-bin/

      - name: Add AudioPluginHost and FancyBench to the artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null
          Copy-Item pluginhost-bin/AudioPluginHost.exe dist/tools/
          $bench = Get-ChildItem -Path build/tools/bench -Recurse -File -Filter 'FancyBench.exe' | Select-Object -First 1
          if (-not $bench) { throw 'FancyBench.exe was not built' }
          Copy-Item $bench.FullName dist/tools/
          New-Item -ItemType Directory -Force -Path dist/tools/examples | Out-Null
          Copy-Item tools/bench/examples/*.json dist/tools/examples/

      - name: Render UI screenshots
        # Even when a check above failed, so the UI can still be compared (Phase 3 Q2.1).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem -Path build/tools/screens -Recurse -File -Filter 'fancy-screens.exe' | Select-Object -First 1
          if (-not $exe) { throw 'fancy-screens.exe was not built' }
          & $exe.FullName screens screens-popups screens-hostscale
          if ($LASTEXITCODE -ne 0) { throw "fancy-screens exited with $LASTEXITCODE" }
          Get-ChildItem -Path screens, screens-popups, screens-hostscale -File | ForEach-Object { "$($_.Name) $($_.Length)" }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: FancyPlugs-VST3-${{ env.SHORT_SHA }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-${{ env.SHORT_SHA }}
          path: screens
          if-no-files-found: error
          retention-days: 14

      - name: Upload pop-up screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-popups-${{ env.SHORT_SHA }}
          path: screens-popups
          if-no-files-found: error
          retention-days: 14

      - name: Upload host-scale screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-hostscale-${{ env.SHORT_SHA }}
          path: screens-hostscale
          if-no-files-found: error
          retention-days: 14

      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: measurements-${{ env.SHORT_SHA }}
          path: measurements
          if-no-files-found: error
          retention-days: 14
