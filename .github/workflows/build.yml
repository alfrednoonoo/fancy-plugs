name: build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'reference/**'
      - 'design/**'
      - '**.md'
      - 'site-src/**'
      - 'tools/site/**'
      - 'content-src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to build
        type: choice
        default: all
        options: [all, kicker, exciter, comp, eq, verb, delay, multicomp, fir, gate, limit, ds, dsmini, sature, room]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: ${{ github.event.inputs.plugin || 'all' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Record build identifiers
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      # Includes JUCE's prebuilt juceaide, so the key changes with the runner image.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 2G

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DFANCY_PLUGINS="$PLUGIN"
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        id: build
        run: cmake --build build -- -k 0

      - name: Run DSP tests
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Record measurements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path measurements | Out-Null
          $exe = Get-ChildItem -Path build/tests -Recurse -File -Filter 'fancy-tests.exe' | Select-Object -First 1
          & $exe.FullName '[measure]' | Tee-Object -FilePath measurements/measurements.txt
          if ($LASTEXITCODE -ne 0) { throw "measurements exited with $LASTEXITCODE" }

      - name: Stage VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem -Path build/plugins -Recurse -Directory -Filter '*.vst3')
          if ($bundles.Count -eq 0) { throw 'No .vst3 bundles were built' }
          foreach ($bundle in $bundles) { Copy-Item -Path $bundle.FullName -Destination dist -Recurse }
          Copy-Item -Path scripts/install.ps1 -Destination dist
          Get-ChildItem -Path dist -Recurse -File | ForEach-Object { $_.FullName }

      # Steinberg's own conformance check (Phase 2.1 H.7.1), built once per SDK tag.
      - name: Cache Steinberg VST3 validator
        id: validator-cache
        uses: actions/cache@v6
        with:
          path: validator-bin
          key: vst3-validator-v3.8.0_build_66-${{ runner.os }}-${{ env.IMAGE_VERSION }}

      - name: Build Steinberg VST3 validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          git clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S vst3sdk -B vst3sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk-build --target validator
          mkdir -p validator-bin
          find vst3sdk-build -name 'validator.exe' -exec cp {} validator-bin/ \;
          ls -la validator-bin

      - name: Run Steinberg VST3 validator
        shell: bash
        timeout-minutes: 10
        run: |
          status=0
          for bundle in dist/*.vst3; do
            echo "::group::validator $bundle"
            if ! ./validator-bin/validator.exe "$bundle"; then
              echo "::error::Steinberg validator failed for $bundle"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run pluginval
        shell: bash
        timeout-minutes: 15
        run: |
          curl -fsSLO https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y pluginval_Windows.zip -opluginval
          for bundle in dist/*.vst3; do
            echo "::group::pluginval $bundle"
            ./pluginval/pluginval.exe --strictness-level 10 --vst3validator "$(pwd)/validator-bin/validator.exe" --validate "$bundle"
            echo "::endgroup::"
          done

      # The built bundles loaded as a host loads them (Phase 2.1 H.7.2).
      - name: Run host-behaviour harness
        shell: pwsh
        timeout-minutes: 20
        run: |
          $exe = Get-ChildItem -Path build/tools/hosttest -Recurse -File -Filter 'fancy-hosttest.exe' | Select-Object -First 1
          if (-not $exe) { throw 'fancy-hosttest.exe was not built' }
          & $exe.FullName dist | Tee-Object -FilePath measurements/hosttest.txt
          if ($LASTEXITCODE -ne 0) { throw "fancy-hosttest exited with $LASTEXITCODE" }

      # FancyBench (Phase 3 Q1): checks against known answers on our own plugins, and runs the
      # example test files with the competitors skipped. Needs every plugin built.
      - name: Run FancyBench smoke checks
        if: env.PLUGIN == 'all'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $exe = Get-ChildItem -Path build/tools/bench -Recurse -File -Filter 'FancyBench.exe' | Select-Object -First 1
          if (-not $exe) { throw 'FancyBench.exe was not built' }
          & $exe.FullName smoke dist measurements/measurements.txt measurements/bench tools/bench/examples | Tee-Object -FilePath measurements/bench.txt
          if ($LASTEXITCODE -ne 0) { throw "FancyBench smoke exited with $LASTEXITCODE" }

      # A test host for the user's PC (Phase 2.1 H.7.3), built once per JUCE version.
      - name: Cache AudioPluginHost
        id: pluginhost-cache
        uses: actions/cache@v6
        with:
          path: pluginhost-bin
          key: audiopluginhost-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Build AudioPluginHost
        if: steps.pluginhost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 20
        run: |
          cmake --build build --target AudioPluginHost
          New-Item -ItemType Directory -Force -Path pluginhost-bin | Out-Null
          $exe = Get-ChildItem -Path build/AudioPluginHost -Recurse -File -Filter 'AudioPluginHost.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AudioPluginHost.exe was not built' }
          Copy-Item $exe.FullName pluginhost-bin/

      - name: Add AudioPluginHost and FancyBench to the artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null
          Copy-Item pluginhost-bin/AudioPluginHost.exe dist/tools/
          $bench = Get-ChildItem -Path build/tools/bench -Recurse -File -Filter 'FancyBench.exe' | Select-Object -First 1
          if (-not $bench) { throw 'FancyBench.exe was not built' }
          Copy-Item $bench.FullName dist/tools/
          New-Item -ItemType Directory -Force -Path dist/tools/examples | Out-Null
          Copy-Item tools/bench/examples/*.json dist/tools/examples/

      - name: Render UI screenshots
        # Even when a check above failed, so the UI can still be compared (Phase 3 Q2.1).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem -Path build/tools/screens -Recurse -File -Filter 'fancy-screens.exe' | Select-Object -First 1
          if (-not $exe) { throw 'fancy-screens.exe was not built' }
          & $exe.FullName screens screens-popups screens-hostscale
          if ($LASTEXITCODE -ne 0) { throw "fancy-screens exited with $LASTEXITCODE" }
          Get-ChildItem -Path screens, screens-popups, screens-hostscale -File | ForEach-Object { "$($_.Name) $($_.Length)" }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: FancyPlugs-VST3-${{ env.SHORT_SHA }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-${{ env.SHORT_SHA }}
          path: screens
          if-no-files-found: error
          retention-days: 14

      - name: Upload pop-up screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-popups-${{ env.SHORT_SHA }}
          path: screens-popups
          if-no-files-found: error
          retention-days: 14

      - name: Upload host-scale screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-hostscale-${{ env.SHORT_SHA }}
          path: screens-hostscale
          if-no-files-found: error
          retention-days: 14

      - name: Render the website's demo clips
        # docs/website-plan.md section 7.1: frames from fancy-screens --demos, encoded to WebM and MP4.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 30
        run: |
          $exe = Get-ChildItem -Path build/tools/screens -Recurse -File -Filter 'fancy-screens.exe' | Select-Object -First 1
          & $exe.FullName --demos demo-frames
          if ($LASTEXITCODE -ne 0) { throw "fancy-screens --demos exited with $LASTEXITCODE" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force -Path demos | Out-Null
          # 2x frames scaled to 1.5x: sharp in the hero on a 2x screen, small enough for a tile.
          $scale = 'scale=trunc(iw*0.375)*2:-2:flags=lanczos'
          foreach ($dir in Get-ChildItem -Path demo-frames -Directory) {
            $in = Join-Path $dir.FullName 'f%04d.png'
            $slug = $dir.Name
            ffmpeg -hide_banner -loglevel error -y -framerate 30 -i $in -vf "$scale,format=yuv420p" -c:v libx264 -preset slow -crf 24 -movflags +faststart -an "demos/$slug.mp4"
            if ($LASTEXITCODE -ne 0) { throw "mp4 failed for $slug" }
            ffmpeg -hide_banner -loglevel error -y -framerate 30 -i $in -vf "$scale,format=yuv420p" -c:v libvpx-vp9 -crf 37 -b:v 0 -row-mt 1 -deadline good -cpu-used 3 -an "demos/$slug.webm"
            if ($LASTEXITCODE -ne 0) { throw "webm failed for $slug" }
            Copy-Item (Join-Path $dir.FullName 'f0000.png') "demos/$slug-poster.png"
          }
          Get-ChildItem -Path demos -File | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1KB)) KB" }

      - name: Upload demo clips
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: demos-${{ env.SHORT_SHA }}
          path: demos
          if-no-files-found: error
          retention-days: 14

      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: measurements-${{ env.SHORT_SHA }}
          path: measurements
          if-no-files-found: error
          retention-days: 14

  # macOS (docs/mac.md, step 2): the same sources as one universal build for Intel and Apple
  # silicon, tested natively and, for the Intel half, under Rosetta. Its own job, so a Mac failure
  # can't hide a Windows one. Green from run 43773992670 on; a failure fails the run.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Record build identifiers
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"
          sw_vers
          uname -m
          xcodebuild -version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      # ccache rather than sccache: it handles a universal compile (two -arch flags) in one call.
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 2G

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFANCY_PLUGINS="$PLUGIN"
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        id: build
        run: cmake --build build -- -k 0

      - name: Check the binaries are universal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          while IFS= read -r binary; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$binary is not universal"; status=1 ;;
            esac
          done < <(find build/plugins \( -path '*.vst3/Contents/MacOS/*' -o -path '*.component/Contents/MacOS/*' \) -type f)
          exit $status

      - name: Run DSP tests (Apple silicon)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Run DSP tests (Intel code, under Rosetta)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          tests=$(find build/tests -type f -name fancy-tests -perm -u+x | head -1)
          arch -x86_64 "$tests"

      - name: Record measurements
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p measurements
          tests=$(find build/tests -type f -name fancy-tests -perm -u+x | head -1)
          "$tests" '[measure]' | tee measurements/measurements.txt
          exit ${PIPESTATUS[0]}

      # Ad-hoc signed (docs/mac.md, Decision 2 A): Apple silicon won't run unsigned code, and a
      # Developer ID isn't used. install.sh removes the quarantine flag on the user's Mac.
      - name: Stage, sign and package VST3 and AU bundles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist
          find build/plugins -type d \( -name '*.vst3' -o -name '*.component' \) -prune -exec cp -R {} dist/ \;
          echo "Before stripping: $(du -sh dist | cut -f1)"
          # Release builds keep their local symbol tables; strip -x removes them and leaves the
          # exported entry points the hosts look up. It must run before signing.
          for bundle in dist/*.vst3 dist/*.component; do
            for bin in "$bundle"/Contents/MacOS/*; do
              strip -x "$bin"
            done
          done
          echo "After stripping: $(du -sh dist | cut -f1)"
          du -sh dist/*.vst3 dist/*.component | sort -h
          for bundle in dist/*.vst3 dist/*.component; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
          cp scripts/install.sh dist/
          chmod +x dist/install.sh
          ls dist
          ls -d dist/*.vst3 dist/*.component

      - name: Cache Steinberg VST3 validator
        if: ${{ !cancelled() }}
        id: validator-cache
        uses: actions/cache@v6
        with:
          path: validator-bin
          key: vst3-validator-v3.8.0_build_66-${{ runner.os }}-${{ env.IMAGE_VERSION }}

      # Built even when the tests failed, so the validator and pluginval still run.
      - name: Build Steinberg VST3 validator
        if: ${{ !cancelled() && steps.validator-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: |
          git clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          cmake -S vst3sdk -B vst3sdk-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk-build --target validator
          mkdir -p validator-bin
          find vst3sdk-build -name validator -type f -perm -u+x -exec cp {} validator-bin/ \;
          ls -la validator-bin

      - name: Run Steinberg VST3 validator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          status=0
          for bundle in dist/*.vst3; do
            echo "::group::validator $bundle"
            if ! ./validator-bin/validator "$bundle"; then
              echo "::error::Steinberg validator failed for $bundle"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run pluginval
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          curl -fsSLO https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q -o pluginval_macOS.zip -d pluginval
          status=0
          for bundle in dist/*.vst3; do
            echo "::group::pluginval $bundle"
            if ! ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --vst3validator "$(pwd)/validator-bin/validator" --validate "$bundle"; then
              echo "::error::pluginval failed for $bundle"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      # Apple's own Audio Unit validator (docs/mac.md, step 3). AUs are found only where macOS
      # looks for them, so they're installed first, with the same install.sh a user runs (step 4).
      - name: Run auval
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          ./dist/install.sh dist
          ls ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          auval -a | grep -i fncy || true
          status=0
          for component in dist/*.component; do
            plist="$component/Contents/Info.plist"
            type=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist")
            subtype=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist")
            manufacturer=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist")
            echo "::group::auval $component ($type $subtype $manufacturer)"
            if ! auval -strict -v "$type" "$subtype" "$manufacturer"; then
              echo "::error::auval failed for $component"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run host-behaviour harness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          mkdir -p measurements
          host=$(find build/tools/hosttest -type f -name fancy-hosttest -perm -u+x | head -1)
          "$host" dist | tee measurements/hosttest.txt
          exit ${PIPESTATUS[0]}

      - name: Run FancyBench smoke checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.PLUGIN == 'all' }}
        timeout-minutes: 25
        run: |
          bench=$(find build/tools/bench -type f -name FancyBench -perm -u+x | head -1)
          "$bench" smoke dist measurements/measurements.txt measurements/bench tools/bench/examples | tee measurements/bench.txt
          exit ${PIPESTATUS[0]}

      - name: Cache AudioPluginHost
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: pluginhost-cache
        uses: actions/cache@v6
        with:
          path: pluginhost-bin
          key: audiopluginhost-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Build AudioPluginHost
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pluginhost-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 30
        run: |
          cmake --build build --target AudioPluginHost
          mkdir -p pluginhost-bin
          app=$(find build/AudioPluginHost -type d -name 'AudioPluginHost.app' -prune | head -1)
          test -n "$app"
          cp -R "$app" pluginhost-bin/

      - name: Add AudioPluginHost and FancyBench to the artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist/tools/examples
          cp -R pluginhost-bin/AudioPluginHost.app dist/tools/
          strip -x dist/tools/AudioPluginHost.app/Contents/MacOS/*
          codesign --force --deep --sign - dist/tools/AudioPluginHost.app
          bench=$(find build/tools/bench -type f -name FancyBench -perm -u+x | head -1)
          cp "$bench" dist/tools/
          strip -x dist/tools/FancyBench
          codesign --force --sign - dist/tools/FancyBench
          du -sh dist/tools/* dist
          cp tools/bench/examples/*.json dist/tools/examples/

      - name: Render UI screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          screens=$(find build/tools/screens -type f -name fancy-screens -perm -u+x | head -1)
          "$screens" screens screens-popups screens-hostscale

      - name: Upload VST3 artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          # Not FancyPlugs-VST3-*: get-latest.ps1 downloads every artifact matching that.
          name: FancyPlugs-macos-${{ env.SHORT_SHA }}
          path: dist
          retention-days: 14

      # The artifact above loses the executable bit (upload-artifact doesn't keep permissions), so
      # releases use this zip, made with ditto, which keeps permissions and signatures intact.
      - name: Make the Mac release zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rm -rf release-mac && mkdir -p "release-mac/FancyPlugs-macos"
          cp -R dist/. "release-mac/FancyPlugs-macos/"
          ditto -c -k --sequesterRsrc --keepParent "release-mac/FancyPlugs-macos" FancyPlugs-macos.zip
          rm -rf zipcheck && mkdir zipcheck && ditto -x -k FancyPlugs-macos.zip zipcheck
          test -x zipcheck/FancyPlugs-macos/install.sh
          for bin in zipcheck/FancyPlugs-macos/*/Contents/MacOS/* zipcheck/FancyPlugs-macos/tools/FancyBench; do
            test -x "$bin" || { echo "not executable: $bin"; exit 1; }
          done
          for bundle in zipcheck/FancyPlugs-macos/*.vst3 zipcheck/FancyPlugs-macos/*.component; do
            codesign --verify --deep --strict "$bundle"
          done
          ls -la FancyPlugs-macos.zip

      - name: Upload the Mac release zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          # Not FancyPlugs-*: get-latest.sh downloads every artifact matching FancyPlugs-macos-*.
          name: release-zip-macos-${{ env.SHORT_SHA }}
          path: FancyPlugs-macos.zip
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-macos-${{ env.SHORT_SHA }}
          path: |
            screens
            screens-popups
            screens-hostscale
          retention-days: 14

      - name: Upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: measurements-macos-${{ env.SHORT_SHA }}
          path: measurements
          retention-days: 14
