name: website

# Builds the website (docs/website-plan.md) with tools/site/build.py and publishes it to GitHub Pages.
# It runs only when something the site is made from changes, and never starts the plugin build.
on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - 'tools/site/**'
      - 'tools/manual/content.py'
      - 'design/website/**'
      - 'docs/images/**'
      - 'docs/manual/**'
      - 'assets/fonts/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the build's Python packages
        run: pip install pillow fonttools brotli markdown pypdf
      - name: Build the site
        run: python tools/site/build.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
