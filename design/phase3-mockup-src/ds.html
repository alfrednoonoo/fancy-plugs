<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="kit2.css"><script src="lib2.js"></script></head><body style="--a:#2DCC70">
<div class="win"><div data-chrome></div>
 <div class="body" style="height:392px">
  <div class="left">
   <div style="display:flex;align-items:center;gap:8px;height:26px"><span class="cap">Detector</span><div class="dd">Main input L+R</div><div class="sp"></div><span class="cap">Mode</span><div class="seg"><span class="m">Split</span><span>Wide</span></div></div>
   <div style="display:flex;gap:10px;margin-top:8px">
     <div style="display:flex;gap:12px">
       <div style="display:flex;flex-direction:column;align-items:center;width:62px"><div class="rl">Threshold</div><svg id="thr" width="40" height="246" style="margin-top:6px"></svg><div class="val" style="color:#2DCC70;white-space:nowrap">-28.0 dB</div></div>
       <div style="display:flex;flex-direction:column;align-items:center;width:22px"><div class="rl">GR</div><svg width="10" height="246" style="margin-top:6px"><rect width="10" height="246" rx="1.5" fill="#141414"/><rect width="10" height="34" rx="1.5" fill="#2DCC70"/></svg><div class="val" style="color:#FFF">-5.6</div></div>
     </div>
     <div style="flex:1;display:flex;flex-direction:column;gap:8px">
       <svg id="disp" width="510" height="160" style="display:block;background:#262626;border-radius:6px"></svg>
       <div style="display:flex;gap:8px">
         <div class="sec" style="padding:8px 10px 6px;flex:1.15">
           <div style="display:flex;justify-content:space-between;align-items:center"><span class="title">Detection</span><div class="seg" style="font-size:11px"><span class="a" style="padding:2px 8px">Band</span><span style="padding:2px 8px">Shelf</span></div></div>
           <div style="display:flex;justify-content:space-around;margin-top:2px"><div class="knob" data-k data-v=".55" data-c="#3598DB" data-l="Freq" data-t="6.20 kHz"></div><div class="knob" data-k data-v=".4" data-c="#2DCC70" data-l="Width" data-t="1.0 oct"></div></div>
         </div>
         <div class="sec" style="padding:8px 10px 6px;flex:1.6">
           <span class="title">Reduction</span>
           <div style="display:flex;justify-content:space-around;margin-top:2px"><div class="knob" data-k data-v=".42" data-c="#2DCC70" data-l="Range" data-t="-12 dB"></div><div class="knob" data-k data-v=".12" data-c="#2DCC70" data-l="Attack" data-t="0.5 ms"></div><div class="knob" data-k data-v=".25" data-c="#2DCC70" data-l="Release" data-t="60 ms"></div></div>
         </div>
       </div>
     </div>
   </div>
   <div class="foot"><div class="cb"><i class="x"></i>Relative threshold</div><div class="cb"><i></i>Listen</div><div class="cb"><i class="x"></i>Link channels</div><div class="edit">⚙ EDIT</div></div>
  </div>
  <div class="rcol" style="width:100px"><div data-m data-h="300" data-v=".55,.57" data-l="Out" data-t="-9.4"></div><div data-f data-h="300" data-v=".72" data-l="Gain" data-t="0.0"></div></div>
 </div>
</div>
<script>
chrome('DS','#2DCC70');
(()=>{const H=246,y=d=>H*(-d/60);let s=`<defs><linearGradient id="tg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00FF96"/><stop offset=".55" stop-color="#7BE84F"/><stop offset="1" stop-color="#FFCF07"/></linearGradient></defs>`;
[0,11].forEach((x,i)=>s+=`<rect x="${x}" y="0" width="9" height="${H}" rx="1.5" fill="#141414"/><rect x="${x}" y="${y(-22-i*2)}" width="9" height="${H-y(-22-i*2)}" rx="1.5" fill="url(#tg)"/>`);
s+=`<rect x="-1" y="${y(-28)-6}" width="22" height="12" rx="2.5" fill="#262626" stroke="#2DCC70" stroke-width="1.5"/><rect x="4" y="${y(-28)-0.75}" width="12" height="1.5" fill="#2DCC70"/>`;
for(const d of [0,-12,-24,-36,-48,-60]) s+=`<text x="40" y="${Math.max(9,Math.min(H-2,y(d)+3))}" font-size="9" fill="#8D8D8D" text-anchor="end">${d}</text>`;
document.getElementById('thr').innerHTML=s})();
(()=>{const W=510,H=160,hy=118,y=d=>8+(hy-12)*(-d/60);let seed=9,r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};let lv=[],gr=[];
for(let x=0;x<=W;x+=2){const t=(x+30)%120;let d=t<14?-18+4*r():-44-6*r();if(t>60&&t<66)d=-24;lv.push([x,y(d)]);const red=Math.max(0,d+28)*0.55;gr.push([x,4+red*2.2])}
const P=a=>a.map(p=>p.join(',')).join(' ');let s=`<polygon points="0,${hy} ${P(lv)} ${W},${hy}" fill="#8D8D8D" opacity=".3"/>`;
s+=`<line x1="0" y1="${y(-28)}" x2="${W}" y2="${y(-28)}" stroke="#2DCC70" opacity=".8"/><polygon points="0,0 ${P(gr)} ${W},0" fill="#2DCC70" opacity=".55"/>`;
s+=`<text x="8" y="${hy-6}" font-size="10" fill="#8D8D8D">sibilance level (grey) · reduction (green) · threshold</text>`;
// frequency ruler
const fx=f=>14+(W-28)*(Math.log10(f/1000)/Math.log10(20)),ry=hy+6;
s+=`<rect x="0" y="${hy}" width="${W}" height="${H-hy}" fill="#141414"/>`;
const f1=6200/1.41,f2=6200*1.41;s+=`<rect x="${fx(f1)}" y="${ry+4}" width="${fx(f2)-fx(f1)}" height="12" rx="3" fill="#2DCC70" opacity=".35"/><rect x="${fx(6200)-3}" y="${ry}" width="6" height="20" rx="2" fill="#3598DB"/>`;
for(const f of [1000,2000,3000,5000,8000,12000,20000]) s+=`<line x1="${fx(f)}" y1="${ry+18}" x2="${fx(f)}" y2="${ry+22}" stroke="#4C4C4C"/><text x="${fx(f)}" y="${H-3}" font-size="9" fill="#8D8D8D" text-anchor="middle">${f/1000}k</text>`;
document.getElementById('disp').innerHTML=s})();
</script></body></html>
