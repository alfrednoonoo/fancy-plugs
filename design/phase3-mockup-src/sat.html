<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="kit2.css"><script src="lib2.js"></script></head><body style="--a:#E77E23">
<div class="win"><div data-chrome></div>
 <div class="body" style="height:392px">
  <div class="left">
   <div style="display:flex;align-items:center;gap:8px;height:26px"><span class="cap">Type</span><div class="seg"><span class="m">Tape</span><span>Tube</span><span>Transistor</span><span>Clip</span></div></div>
   <div style="display:flex;gap:8px;margin-top:8px">
     <svg id="tc" width="170" height="160" style="display:block;background:#262626;border-radius:6px"></svg>
     <svg id="hb" width="432" height="160" style="display:block;background:#262626;border-radius:6px"></svg>
   </div>
   <div style="display:flex;gap:8px;margin-top:8px">
     <div class="sec" style="padding:8px 8px 6px;flex:1.6">
       <span class="title" style="margin-left:4px">Drive</span>
       <div style="display:flex;justify-content:space-around;margin-top:2px">
        <div class="knob" data-k data-v=".55" data-c="#E77E23" data-l="Drive" data-t="+14 dB"></div>
        <div class="knob" data-k data-v=".35" data-c="#E77E23" data-bi data-l="Character" data-t="even 30 %"></div>
        <div class="knob" data-k data-v=".6" data-c="#E77E23" data-bi data-l="Tone" data-t="+2.0 dB"></div>
       </div>
     </div>
     <div class="sec" style="padding:8px 8px 6px;flex:1.1">
       <span class="title" style="margin-left:4px">Band</span>
       <div style="display:flex;justify-content:space-around;margin-top:2px">
        <div class="knob" data-k data-v=".18" data-c="#3598DB" data-l="Low" data-t="120 Hz"></div>
        <div class="knob" data-k data-v="1" data-c="#3598DB" data-l="High" data-t="Off"></div>
       </div>
     </div>
   </div>
   <div class="foot"><div class="cb"><i class="x"></i>Auto gain</div><div class="cb"><i></i>Listen to added harmonics</div><div class="edit">⚙ EDIT</div></div>
  </div>
  <div class="rcol" style="width:104px"><div data-m data-h="300" data-v=".6,.62" data-l="Out" data-t="-7.9"></div><div data-f data-h="300" data-v=".8" data-l="Wet" data-t="0.0"></div><div data-f data-h="300" data-v="0" data-l="Dry" data-t="-inf"></div></div>
 </div>
</div>
<script>
chrome('SATURATE','#E77E23');
(()=>{const S=160,m=16,W=170,x=v=>m+8+(W-2*m-8)*(v+1)/2,y=v=>S-m-(S-2*m)*(v+1)/2;let s='';
s+=`<line x1="${x(-1)}" y1="${y(0)}" x2="${x(1)}" y2="${y(0)}" stroke="#303030"/><line x1="${x(0)}" y1="${y(-1)}" x2="${x(0)}" y2="${y(1)}" stroke="#303030"/><line x1="${x(-1)}" y1="${y(-1)}" x2="${x(1)}" y2="${y(1)}" stroke="#4C4C4C" stroke-dasharray="3 3"/>`;
const d=2.6,b=0.12,f=v=>Math.tanh(d*(v+b))-Math.tanh(d*b),n=Math.max(Math.abs(f(1)),Math.abs(f(-1)))*1.04;let p=[];for(let v=-1;v<=1.0001;v+=0.02){p.push(`${x(v)},${y(f(v)/n)}`)}
s+=`<polyline points="${p.join(' ')}" fill="none" stroke="#E77E23" stroke-width="2"/><text x="10" y="14" font-size="10" fill="#8D8D8D">in → out</text>`;
document.getElementById('tc').innerHTML=s})();
(()=>{const W=432,H=160,L=36,B=H-24,T=22,y=d=>T+(B-T)*(-d/72);let s='';
for(const d of [0,-24,-48,-72]) s+=`<line x1="${L}" y1="${y(d)}" x2="${W-12}" y2="${y(d)}" stroke="${d==0?'#424242':'#303030'}"/><text x="${L-6}" y="${y(d)+3}" font-size="9" fill="#8D8D8D" text-anchor="end">${d}</text>`;
const H2=[0,-18,-27,-34,-38,-45,-47,-55,-56,-63],bw=26,gap=(W-L-20-bw*10)/9;
H2.forEach((d,i)=>{const xx=L+6+i*(bw+gap);const even=(i+1)%2==0;s+=`<rect x="${xx}" y="${y(d)}" width="${bw}" height="${B-y(d)}" rx="2" fill="#E77E23" opacity="${i==0?.35:(even?1:.7)}"/><text x="${xx+bw/2}" y="${H-8}" font-size="9" fill="#8D8D8D" text-anchor="middle">${i==0?'1k':'H'+(i+1)}</text>`});
s+=`<text x="12" y="14" font-size="10" fill="#8D8D8D">Harmonics added to a 1 kHz tone at these settings · THD 6.1 %</text>`;
document.getElementById('hb').innerHTML=s})();
</script></body></html>
