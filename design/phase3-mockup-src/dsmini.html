 </div>

<script>
(()=>{const W=238,H=92,y=d=>6+(H-12)*(-d/60);let seed=21,r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};let lv=[],gr=[];
for(let x=0;x<=W;x+=2){const t=(x+18)%64;let d=t<9?-16+4*r():-50-5*r();lv.push([x,y(d)]);gr.push([x,3+Math.max(0,d+28)*1.7])}
const P=a=>a.map(p=>p.join(',')).join(' ');let s=`<polygon points="0,${H} ${P(lv)} ${W},${H}" fill="#8D8D8D" opacity=".22"/>`;

document.getElementById('disp').innerHTML=s})();
