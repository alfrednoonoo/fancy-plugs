<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="lib.js"></script></head><body>
<div class="win" style="width:760px">
 <div class="hdr"><div class="dd" style="width:150px">No preset</div><div class="btn">+ New</div><div class="btn">Parameter</div><div class="btn">4 in 2 out</div><div class="sp"></div><span class="cap">Detector</span><div class="dd">Main input L+R</div><div data-k data-v=".5" data-c="#00A884" data-s="16" style="width:26px"></div><div class="on">⏻ ON</div></div>
 <div style="display:flex">
  <div style="flex:1;padding:10px 10px 8px 12px">
   <svg id="g" width="610" height="190" style="display:block;background:#262626;border-radius:6px"></svg>
   <div style="display:flex;align-items:center;gap:6px;margin:10px 0 8px">
     <div class="tab" style="color:#fff;border:1px solid #C0363C">1</div><div class="tab" style="background:#9648BA;color:#fff">2</div><div class="tab" style="border:1px solid #24AEC6;color:#fff">3</div><div class="tab" style="border:1px solid #0CC08A;color:#fff">4</div><div class="tab" style="color:#EDEDED">+</div>
     <span class="title" style="margin-left:10px;color:#9648BA">Band 2</span><span class="cap">120 Hz – 1.20 kHz</span>
     <div class="sp"></div><div class="btn" style="font-size:10.5px;padding:3px 8px">S</div><div class="btn" style="font-size:10.5px;padding:3px 8px;color:#9648BA">⏻</div><div class="btn" style="font-size:12px;padding:1px 8px;color:#909090">×</div>
   </div>
   <div class="sec" style="display:flex;align-items:flex-start;gap:6px;padding:10px 10px 8px">
     <div style="display:flex;gap:4px;align-items:flex-end;margin-right:6px">
       <div style="position:relative"><div data-m data-h="92" data-v=".58,.6" data-l="In"></div></div>
       <div data-f data-h="92" data-v=".62" data-c="#9648BA" data-l="Threshold" data-t="-18.0 dB"></div>
       <div style="display:flex;flex-direction:column;align-items:center"><div class="cap">GR</div><svg width="8" height="92"><rect width="8" height="92" rx="1.5" fill="#141414"/><rect width="8" height="20" rx="1.5" fill="#F1C315"/></svg><div class="val" style="color:#EDEDED;margin:0">-4.1</div></div>
     </div>
     <div>
       <div style="display:flex">
        <div class="knob" data-k data-v=".34" data-c="#9648BA" data-l="Ratio" data-t="3.0:1"></div>
        <div class="knob" data-k data-v=".2" data-c="#9648BA" data-l="Knee" data-t="6.0 dB"></div>
        <div class="knob" data-k data-v=".18" data-c="#9648BA" data-l="Attack" data-t="10.0 ms"></div>
        <div class="knob" data-k data-v=".4" data-c="#9648BA" data-l="Release" data-t="120 ms"></div>
        <div class="knob" data-k data-v=".12" data-c="#9648BA" data-l="RMS size" data-t="5.0 ms"></div>
        <div class="knob" data-k data-v=".62" data-c="#9648BA" data-bi data-l="Gain" data-t="+2.0 dB"></div>
       </div>
       <div style="display:flex;gap:16px;margin:8px 0 0 8px"><div class="cb"><i class="x"></i>Auto make-up</div><div class="cb"><i class="x"></i>Auto release</div><div class="cb"><i></i>Feedback detect</div><div class="cb"><i></i>Sidechain</div></div>
     </div>
   </div>
   <div style="display:flex;gap:18px;margin-top:9px;padding-left:2px"><div class="cb"><i class="x"></i>Show spectrum</div><div class="cb"><i></i>Link bands</div><div class="cb"><i class="x"></i>Show grid</div><div class="cb"><i></i>Limit output</div><div class="sp"></div><span class="cap">Crossover</span><div class="dd" style="font-size:10.5px;padding:3px 7px">LR 24 dB · Min phase</div></div>
  </div>
  <div style="width:128px;background:#262626;display:flex;gap:9px;justify-content:center;padding:14px 8px 10px">
    <div data-m data-h="300" data-v=".64,.66" data-l="Out" data-t="-4.2"></div>
    <div data-f data-h="300" data-v=".7" data-l="Wet" data-t="-1.5"></div>
    <div data-f data-h="300" data-v="0" data-l="Dry" data-t="-inf"></div>
  </div>
 </div>
</div>
<script>
const W=610,H=190,lx=f=>34+(W-44)*Math.log10(f/20)/3,ly=d=>12+(H-34)*(-d/60);
let s='';for(const f of [50,100,200,500,1000,2000,5000,10000,20000]){s+=`<line x1="${lx(f)}" y1="10" x2="${lx(f)}" y2="${H-22}" stroke="#303030"/><text x="${lx(f)}" y="${H-8}" fill="#909090" font-size="9" text-anchor="middle">${f>=1000?f/1000+'k':f}</text>`}
for(const d of [0,-12,-24,-36,-48,-60]){s+=`<line x1="34" y1="${ly(d)}" x2="${W-10}" y2="${ly(d)}" stroke="#303030"/><text x="28" y="${ly(d)+3}" fill="#909090" font-size="9" text-anchor="end">${d}</text>`}
let seed=7,rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};let pts=[];for(let f=25;f<20000;f*=1.03){let d=-14-9*Math.sign(Math.log10(f/60))*Math.abs(Math.log10(f/60))**1.25-6*rnd()-(f<60?8:0);pts.push(`${lx(f)},${ly(Math.max(-60,d))}`)}
s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#E77E23" stroke-width="1.3" opacity=".8"/>`;
const B=[[20,120,'#C0363C',-24,2.2],[120,1200,'#9648BA',-18,4.1],[1200,6000,'#24AEC6',-28,1.3],[6000,20000,'#0CC08A',-32,0.6]];
B.forEach(([a,b,c,t,gr],i)=>{const x0=lx(a),x1=lx(b);s+=`<rect x="${x0}" y="${ly(t)}" width="${x1-x0}" height="${H-22-ly(t)}" fill="${c}" opacity="${i==1?.32:.16}"/><line x1="${x0}" y1="${ly(t)}" x2="${x1}" y2="${ly(t)}" stroke="${c}" stroke-width="2"/>
<rect x="${x0+6}" y="12" width="${x1-x0-12}" height="${gr*3.2}" fill="#F1C315" opacity=".85" rx="1"/>
<circle cx="${(x0+x1)/2}" cy="${ly(t)}" r="8" fill="${i==1?c:'#EDEDED'}" stroke="${c}" stroke-width="2"/><text x="${(x0+x1)/2}" y="${ly(t)+3.5}" fill="${i==1?'#fff':'#262626'}" font-size="9.5" font-weight="700" text-anchor="middle">${i+1}</text>`});
[120,1200,6000].forEach(f=>{s+=`<line x1="${lx(f)}" y1="10" x2="${lx(f)}" y2="${H-22}" stroke="#3690CC" stroke-width="1.5"/><rect x="${lx(f)-3}" y="${H-30}" width="6" height="10" rx="2" fill="#3690CC"/>`});

document.getElementById('g').innerHTML=s;
</script></body></html>
